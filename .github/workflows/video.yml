# Product video — capture the real UI, then render both cuts.
#
# THE VIDEO IS BUILT LOCALLY. Run `./video/make.sh`: it stages the app on your
# own machine, captures, and renders into video/out/. That is the supported
# path and the one that gets used.
#
# This workflow is kept only as a manual fallback and is deliberately
# UNSCHEDULED — no cron and no `push` trigger, so it never runs on its own and
# costs nothing unless somebody asks for it by hand.
#
# It also no longer commits screenshots: video/assets/shots/ is gitignored, so
# the drift-PR step below has nothing to open a PR about. A screenshot nothing
# refreshes goes on looking current long after the UI has moved, which is worse
# than having none.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          # Without `scope`, setup-node writes a BARE
          # `registry=https://npm.pkg.github.com/` into ~/.npmrc and every
          # package — playwright, vite, react — resolves there and 404s. With
          # it, only @companionintelligence/* (the private video-kit) does.
          scope: "@companionintelligence"

      # ⚠️ THIS STEP IS THE REASON NO CAPTURE HAS EVER RUN IN THIS REPO.
      #
      # Run 30868089948 died here after 13s:
      #   npm error code E403
      #   npm error 403 Forbidden - GET
      #     https://npm.pkg.github.com/@companionintelligence%2fvideo-kit
      #     - Permission permission_denied: read_package
      #
      # @companionintelligence/video-kit (org package id 14206518) is private and
      # LINKED TO REPOSITORY CI-Common. A private GitHub Packages npm package
      # denies the calling repo's GITHUB_TOKEN unless that repo is explicitly
      # granted access, whatever the token's scope. This is NOT a workflow-
      # permissions problem: /actions/permissions/workflow already returns
      # default_workflow_permissions: "write".
      #
      # THE FIX (one action, unblocks all 12 product repos at once) —
      #   https://github.com/orgs/companionintelligence/packages/npm/package/video-kit
      #   -> Package settings -> Manage Actions access -> Add repository
      #   -> companionintelligence/CI-Spellbook, role: Read
      # Package-access changes of this class are web-UI only; `gh api PATCH`
      # 404s, so do not try to script it.
      #
      # A PAT fallback exists (repo secret with read:packages, swapped in for
      # NODE_AUTH_TOKEN below) but is deliberately NOT wired up here: no such
      # secret exists on this repo today — `gh secret list` shows only
      # SENTRY_DSN — and referencing a missing secret would resolve to an empty
      # string and fail with the same 403, one step later and less legibly.
      # Grant the package access instead.
      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # Spellbook's stage is just its Vite dev server. `playwright.config.js`
      # already declares webServer { command: "npm run dev",
      # url: "http://localhost:5500", reuseExistingServer: true } — but
      # `ci-video capture` is not a Playwright test run, so nothing triggers
      # that webServer. Boot the exact same command here rather than invent a
      # second way to stand the app up; reuseExistingServer means the repo's own
      # e2e suite attaches to this server instead of racing it on port 5500.
      - name: Start app
        run: |
          npm ci
          npm run dev > /tmp/spellbook-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sfo /dev/null http://localhost:5500 && break
            sleep 2
          done
          curl -sfo /dev/null http://localhost:5500 || {
            echo "::error::dev server never answered on :5500"
            cat /tmp/spellbook-dev.log
            exit 1
          }

      - name: Capture
        working-directory: video
        run: npm run capture

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      # DO NOT DELETE AS REDUNDANT — the ubuntu-24.04 runner image does not ship
      # FFmpeg. Without this step `npm run render` below fails immediately with
      #   ✗ FFmpeg not found — FFmpeg is required to encode video.
      #   ✗ FFprobe not found — FFprobe is required to probe media assets.
      # ci-video needs BOTH binaries (encode + probe); the `ffmpeg` apt package
      # provides them together. Guarded with the Render step's own condition so a
      # capture-only run (render=false) does not pay for the install.
      - name: Install FFmpeg
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-spellbook-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Spellbook product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.

            **Read this before calling the FIRST such PR "drift".** The shots committed today
            were taken against a stale 13-card build (`library-first-run.png` shows
            *Local AI Apps & Model Managers* as the third card; current source renders
            *MCP Servers & Connectors* there). The first PR this job opens will therefore
            rewrite every PNG, and that diff is two one-time corrections stacked together —
            the wrong-build fix, plus the ubuntu-latest font baseline described in
            `video/capture.config.mjs` hazard 6. It is a content correction, not drift.
            Subsequent PRs are real drift and should be read as such.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
