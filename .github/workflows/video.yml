# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # Spellbook's stage is just its Vite dev server. `playwright.config.js`
      # already declares webServer { command: "npm run dev",
      # url: "http://localhost:5500", reuseExistingServer: true } — but
      # `ci-video capture` is not a Playwright test run, so nothing triggers
      # that webServer. Boot the exact same command here rather than invent a
      # second way to stand the app up; reuseExistingServer means the repo's own
      # e2e suite attaches to this server instead of racing it on port 5500.
      #
      # --registry is deliberate: setup-node's `registry-url` above (needed for
      # the private @companionintelligence video-kit package) writes a BARE
      # `registry=https://npm.pkg.github.com/` into ~/.npmrc, which would
      # otherwise send react/vite/tailwind there and 404.
      - name: Start app
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run dev > /tmp/spellbook-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sfo /dev/null http://localhost:5500 && break
            sleep 2
          done
          curl -sfo /dev/null http://localhost:5500 || {
            echo "::error::dev server never answered on :5500"
            cat /tmp/spellbook-dev.log
            exit 1
          }

      - name: Capture
        working-directory: video
        run: npm run capture

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-spellbook-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Spellbook product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
