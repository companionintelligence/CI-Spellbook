name: Publish container

# Builds the container, runs it, screenshots its web UI as a gate, then pushes
# to GHCR. The marketplace manifest pins :latest, so every push to main republishes
# :latest (plus an immutable :sha-<short> tag).

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#     tags: ["*"]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/companionintelligence/ci-spellbook
  INTERNAL_PORT: "5500"

jobs:
  publish:
    name: Build, screenshot-test, publish
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Safety net only. The arm64 leg of the image no longer executes anything
      # on the target architecture — the Dockerfile pins its build stage to
      # $BUILDPLATFORM and the nginx runtime stage has no RUN — so nothing here
      # currently needs emulation. Registering QEMU keeps a later `RUN` in the
      # runtime stage from failing outright, but read the Dockerfile's build
      # stage comment before adding one: this dependency tree's Rust N-API
      # binaries (@tailwindcss/oxide, lightningcss) crash under QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${IMAGE_NAME}:sha-${short}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${short}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # Advisory only — a missing secret must never fail the publish. Without it
      # the build arg below expands to empty, the Dockerfile ARG default wins,
      # and we ship the same DSN-less bundle we always did (SDK tree-shaken out).
      - name: Check Sentry DSN availability
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::notice::SENTRY_DSN secret is not set — publishing a bundle with no DSN compiled in. The Sentry SDK is tree-shaken out entirely and the image cannot report."
          else
            echo "SENTRY_DSN is set — baking it into the published bundle."
          fi

      # Built WITH the DSN so the screenshot gate exercises the bundle that
      # actually ships: a configured build keeps the ~88 kB SDK and takes the
      # Sentry.init path, neither of which a DSN-less build has.
      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            VITE_SENTRY_RELEASE=ci-spellbook@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        # CI_TELEMETRY=off because the bundle now has a real DSN baked in and this
        # is a throwaway CI container: without it every screenshot run would file
        # its errors into the production Sentry project. 40-telemetry-config.sh
        # resolves this into /api/config/telemetry, which the bundle consults
        # before initialising — that is how a build-time DSN stays switchable.
        run: docker run -d --name app -e CI_TELEMETRY=off -p 8080:${INTERNAL_PORT} ${{ steps.meta.outputs.sha_tag }}

      - name: Wait for HTTP
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)"
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then echo "up ($code)"; exit 0; fi
            sleep 2
          done
          echo "container never responded"; docker logs app; exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Container screenshot test
        run: |
          cd tests/container
          npm install
          npx playwright install --with-deps chromium
          APP_URL=http://localhost:8080 SCREENSHOT_PATH="$GITHUB_WORKSPACE/screenshot.png" npx playwright test

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: container-screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Container logs (on failure)
        if: failure()
        run: docker logs app || true

      - name: Tear down container
        if: always()
        run: docker rm -f app || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both architectures the marketplace manifest declares
          # (supported_architectures: ["amd64","arm64"]). The Vite bundle is
          # built once, natively, by the $BUILDPLATFORM-pinned build stage and
          # shared by both; only the nginx layer below it differs.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          # This app is browser-only: nginx serves a static bundle and there is no
          # server process, so there is no runtime SENTRY_DSN to read. Vite inlines
          # import.meta.env.* at build time, which makes this the only moment a DSN
          # can enter the artifact at all.
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            VITE_SENTRY_RELEASE=ci-spellbook@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
