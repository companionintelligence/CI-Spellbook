name: CI and Deploy

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches:
#       - main
#   pull_request:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v4
      # 22, matching the Dockerfile's node:22-bookworm-slim — CI was pinned to
      # Node 20, which is EOL and which no longer satisfies jsdom's engines, so
      # it was testing a runtime nothing ships on.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint design canon + brand mirrors
        run: npm run lint:canon
      - name: Run unit tests
        run: npm run test:unit
      # Reporting is opt-out, but an unconfigured build is a separate thing:
      # with no VITE_SENTRY_DSN the Sentry SDK must be tree-shaken out of the
      # bundle entirely, not merely inert. That holds
      # only while src/lib/telemetry.js keeps its module-scope
      # `const DSN = import.meta.env.VITE_SENTRY_DSN` shape (no optional
      # chaining), which is one innocent-looking refactor away from breaking —
      # and under rolldown it would break silently. See
      # docs/operations/error-reporting.md.
      - name: Assert no Sentry code in a DSN-less bundle
        run: npm run assert:no-sentry-without-dsn
      # Catalog shape: the table format, and no raw HTML or non-https link in a
      # shelf. The networked check (`npm run check:links`) is run on purpose, not here.
      - name: Lint catalog content
        run: npm run lint:content
      # `vite build` also runs scripts/assert-site.mjs: the metadata, the four
      # cross-links to ci.computer and the docs, the 404 page and the CSP's
      # promises are checked against src/lib/site.js, so a drift fails here.
      - name: Build (and check the site's public surface)
        run: npm run build
      # Google Analytics is opt-in at build time (GA_MEASUREMENT_ID). This builds with
      # it unset, malformed and valid, and rebuilds the valid one: nothing may leak
      # into the container's bundle, and nothing may be half-present on Pages.
      - name: Check analytics is opt-in
        run: npm run check:ga-build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run tests
        run: npm test

  build-main:
    runs-on: ubuntu-latest
    name: Build (main smoke test)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: npm run build
      # Cloudflare Pages production deploys are handled by the Cloudflare
      # GitHub App (configured in the Cloudflare dashboard), which builds
      # from main on its own and posts the deploy URL as a check.
      # We only run a build step here as a smoke test; we skip wrangler
      # because the required CLOUDFLARE_API_TOKEN / CLOUDFLARE_PAGES_PROJECT
      # secrets aren't set in this repo. To re-enable wrangler-based
      # deploys: add those secrets, then restore the wrangler-action step.
