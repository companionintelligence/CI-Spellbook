ext {
    // 24, not Capacitor's default 23: Play's automatic protection refuses an App Bundle whose
    // minSdk is below 24 (same floor as Companion-Memory's Android shell).
    minSdkVersion = 24
    // Play requires target API 36 of new uploads (per Companion-Memory's android/variables.gradle
    // note, dated 2026-10; confirm against Play Console before submitting). Capacitor 8's own
    // matrix is also 36, and @capacitor/android reads compileSdk/targetSdk from this file. It
    // needs AGP 8.13.0 (build.gradle) on Gradle 8.14.3 (gradle/wrapper).
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}