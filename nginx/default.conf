# Serve the built SPA on the Hub internalPort (5500) with history-API fallback.
server {
    listen       5500;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Hashed build assets — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
