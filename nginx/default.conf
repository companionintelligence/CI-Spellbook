# Serve the built SPA on the Hub internalPort (5500) with history-API fallback.
server {
    listen       5500;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Compress text assets (the JS bundle and markdown spells are the bulk of
    # transfer; images are already compressed).
    gzip on;
    gzip_types text/css application/javascript text/markdown application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Spell content — serve .md as UTF-8 markdown instead of octet-stream.
    location /markdown/ {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    # SPA routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
