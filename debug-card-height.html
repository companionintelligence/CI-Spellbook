<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Height Debug Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
        }
        
        #debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            max-width: 400px;
            font-size: 12px;
            z-index: 10000;
        }
        
        #debug-info h3 {
            margin-top: 0;
            color: #4CAF50;
        }
        
        #debug-info pre {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 5px 0;
        }
        
        .test-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 14px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        #app-frame {
            width: 100%;
            height: 800px;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="debug-info">
        <h3>Card Height Debugger</h3>
        <button onclick="analyzeCard()">Analyze Current Card</button>
        <button onclick="expandFirstCard()">Expand First Card</button>
        <button onclick="scrollToBottom()">Scroll Card to Bottom</button>
        <div id="results"></div>
    </div>
    
    <div class="test-container">
        <h1>Card Height Analysis Tool</h1>
        <p>This tool helps debug the expanded card height issue. Click a button above to start.</p>
        
        <iframe id="app-frame" src="http://localhost:5503"></iframe>
    </div>

    <script>
        const frame = document.getElementById('app-frame');
        const results = document.getElementById('results');
        
        function getFrameDoc() {
            return frame.contentDocument || frame.contentWindow.document;
        }
        
        function analyzeCard() {
            try {
                const doc = getFrameDoc();
                const expandedCard = doc.querySelector('.group.full-expanded, .group.content-visible');
                
                if (!expandedCard) {
                    results.innerHTML = '<pre>❌ No expanded card found</pre>';
                    return;
                }
                
                const cardBack = expandedCard.querySelector('.card-back');
                const markdownBody = cardBack?.querySelector('.markdown-body');
                
                const analysis = {
                    card: {
                        boundingBox: expandedCard.getBoundingClientRect(),
                        computed: {
                            height: getComputedStyle(expandedCard).height,
                            maxHeight: getComputedStyle(expandedCard).maxHeight,
                            overflow: getComputedStyle(expandedCard).overflow,
                        },
                        customProps: {
                            '--card-content-height': expandedCard.style.getPropertyValue('--card-content-height'),
                        }
                    },
                    cardBack: cardBack ? {
                        scrollHeight: cardBack.scrollHeight,
                        clientHeight: cardBack.clientHeight,
                        offsetHeight: cardBack.offsetHeight,
                        isOverflowing: cardBack.scrollHeight > cardBack.clientHeight,
                        hiddenContent: cardBack.scrollHeight - cardBack.clientHeight,
                        computed: {
                            height: getComputedStyle(cardBack).height,
                            overflowY: getComputedStyle(cardBack).overflowY,
                            padding: getComputedStyle(cardBack).padding,
                        }
                    } : null,
                    markdownBody: markdownBody ? {
                        boundingBox: markdownBody.getBoundingClientRect(),
                        scrollHeight: markdownBody.scrollHeight,
                        offsetHeight: markdownBody.offsetHeight,
                    } : null
                };
                
                let html = '<pre style="font-size: 11px;">';
                html += '<strong style="color: #4CAF50;">📊 ANALYSIS RESULTS</strong>\n\n';
                
                html += '<strong>Card Container:</strong>\n';
                html += `  Height: ${analysis.card.computed.height}\n`;
                html += `  Max Height: ${analysis.card.computed.maxHeight}\n`;
                html += `  --card-content-height: ${analysis.card.customProps['--card-content-height'] || 'NOT SET'}\n`;
                html += `  BoundingBox height: ${Math.round(analysis.card.boundingBox.height)}px\n\n`;
                
                if (analysis.cardBack) {
                    html += '<strong>Card Back (scrollable area):</strong>\n';
                    html += `  Computed height: ${analysis.cardBack.computed.height}\n`;
                    html += `  Client height: ${analysis.cardBack.clientHeight}px\n`;
                    html += `  Scroll height: ${analysis.cardBack.scrollHeight}px\n`;
                    html += `  Overflow-Y: ${analysis.cardBack.computed.overflowY}\n`;
                    html += `  Padding: ${analysis.cardBack.computed.padding}\n\n`;
                    
                    if (analysis.cardBack.isOverflowing) {
                        html += `<strong style="color: #ff5555;">⚠️  OVERFLOW DETECTED!</strong>\n`;
                        html += `  Hidden content: ${analysis.cardBack.hiddenContent}px\n`;
                        html += `  Content is ${Math.round((analysis.cardBack.hiddenContent / analysis.cardBack.scrollHeight) * 100)}% cut off\n\n`;
                    } else {
                        html += `<strong style="color: #50fa7b;">✓ No overflow - content fits!</strong>\n\n`;
                    }
                }
                
                if (analysis.markdownBody) {
                    html += '<strong>Markdown Body:</strong>\n';
                    html += `  Scroll height: ${analysis.markdownBody.scrollHeight}px\n`;
                    html += `  Bounding height: ${Math.round(analysis.markdownBody.boundingBox.height)}px\n`;
                }
                
                html += '</pre>';
                results.innerHTML = html;
                
            } catch (e) {
                results.innerHTML = `<pre style="color: #ff5555;">Error: ${e.message}</pre>`;
            }
        }
        
        function expandFirstCard() {
            try {
                const doc = getFrameDoc();
                const firstCard = doc.querySelector('.group');
                
                if (!firstCard) {
                    results.innerHTML = '<pre>❌ No cards found</pre>';
                    return;
                }
                
                results.innerHTML = '<pre>Clicking first card...</pre>';
                firstCard.click();
                
                // Wait for animation to complete
                setTimeout(() => {
                    results.innerHTML = '<pre>Card expanded. Click "Analyze Current Card" to see results.</pre>';
                }, 3500);
                
            } catch (e) {
                results.innerHTML = `<pre style="color: #ff5555;">Error: ${e.message}</pre>`;
            }
        }
        
        function scrollToBottom() {
            try {
                const doc = getFrameDoc();
                const cardBack = doc.querySelector('.group.full-expanded .card-back, .group.content-visible .card-back');
                
                if (!cardBack) {
                    results.innerHTML = '<pre>❌ No expanded card back found</pre>';
                    return;
                }
                
                cardBack.scrollTop = cardBack.scrollHeight;
                results.innerHTML = '<pre>Scrolled to bottom. Click "Analyze Current Card" to verify.</pre>';
                
            } catch (e) {
                results.innerHTML = `<pre style="color: #ff5555;">Error: ${e.message}</pre>`;
            }
        }
        
        // Auto-analyze when card expansion detected
        setInterval(() => {
            const doc = getFrameDoc();
            const expandedCard = doc?.querySelector('.group.content-visible');
            if (expandedCard && !window.lastAnalyzed) {
                window.lastAnalyzed = true;
                setTimeout(analyzeCard, 500);
            } else if (!expandedCard) {
                window.lastAnalyzed = false;
            }
        }, 1000);
    </script>
</body>
</html>
